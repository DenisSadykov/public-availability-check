name: Availability check
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: availability
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check configured HTTPS endpoints
        env:
          MONITOR_ENDPOINTS_JSON: ${{ secrets.MONITOR_ENDPOINTS_JSON }}
          MONITOR_CALLBACK_URL: ${{ secrets.MONITOR_CALLBACK_URL }}
          MONITOR_CALLBACK_TOKEN: ${{ secrets.MONITOR_CALLBACK_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          
          
          def https_url(value):
              parsed = urllib.parse.urlsplit(value)
              if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
                  raise ValueError("invalid HTTPS configuration")
              return value
          
          
          def main():
              try:
                  endpoints = json.loads(os.environ["MONITOR_ENDPOINTS_JSON"])
                  if not isinstance(endpoints, list) or not 1 <= len(endpoints) <= 10:
                      raise ValueError("invalid endpoint count")
                  callback = https_url(os.environ["MONITOR_CALLBACK_URL"])
                  token = os.environ["MONITOR_CALLBACK_TOKEN"]
                  if not token or "\n" in token or "\r" in token:
                      raise ValueError("invalid callback token")
                  clean = []
                  for index, item in enumerate(endpoints, 1):
                      url = https_url(item["url"])
                      expected = item.get("expected", [200])
                      if not isinstance(expected, list) or not expected or not all(type(code) is int and 100 <= code <= 599 for code in expected):
                          raise ValueError("invalid expected statuses")
                      clean.append(("endpoint-" + str(index), url, expected))
              except (KeyError, ValueError, TypeError):
                  print("Invalid monitor configuration", file=sys.stderr)
                  return 1
              checks = []
              for name, url, expected in clean:
                  code = 0
                  latency = 0
                  for attempt in range(3):
                      started = time.monotonic()
                      try:
                          req = urllib.request.Request(url, headers={"User-Agent": "external-availability-check/1.0"})
                          with urllib.request.urlopen(req, timeout=12) as response:
                              code = response.status
                      except urllib.error.HTTPError as exc:
                          code = exc.code
                          exc.close()
                      except (OSError, urllib.error.URLError, TimeoutError):
                          code = 0
                      latency = round((time.monotonic() - started) * 1000)
                      if code in expected:
                          break
                      if attempt < 2:
                          time.sleep(2 ** attempt)
                  checks.append({"name": name, "status": "ok" if code in expected else "bad", "http_status": code, "latency_ms": latency})
              failed = sum(item["status"] == "bad" for item in checks)
              report = {"source": "github-actions-blackbox", "run_key": os.environ["GITHUB_RUN_ID"] + ":" + os.environ["GITHUB_RUN_ATTEMPT"], "status": "bad" if failed else "ok", "observed_at": datetime.now(timezone.utc).isoformat(), "checks": checks}
              request = urllib.request.Request(callback, data=json.dumps(report).encode(), method="POST", headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(request, timeout=12) as response:
                      if response.status != 204:
                          raise ValueError("unexpected callback status")
              except (OSError, urllib.error.URLError, TimeoutError, ValueError):
                  print("Report delivery failed", file=sys.stderr)
                  return 1
              print("Report accepted; checks=" + str(len(checks)) + "; failed=" + str(failed))
              return 1 if failed else 0
          
          
          if __name__ == "__main__":
              sys.exit(main())
          PYTHON
